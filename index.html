<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trainingsplan Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a2e;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:16px}
.card{background:#fff;border-radius:16px;padding:40px 32px;max-width:360px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.4);text-align:center}
h1{font-size:1.4rem;color:#1a1a2e;margin-bottom:6px}
p{color:#666;font-size:.9rem;margin-bottom:28px}
input{width:100%;padding:14px;font-size:1.5rem;letter-spacing:.3em;text-align:center;border:2px solid #ddd;border-radius:10px;outline:none;transition:border .2s}
input:focus{border-color:#3a86ff}
input.error{border-color:#e63946;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)} 75%{transform:translateX(6px)}}
button{margin-top:16px;width:100%;padding:14px;background:#3a86ff;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:background .2s}
button:hover{background:#2563eb}
.msg{margin-top:14px;font-size:.85rem;color:#e63946;min-height:18px}
</style>
</head>
<body>
<div class="card">
  <h1>Mein Trainingsplan</h1>
  <p>Bitte gib deinen persönlichen PIN ein.</p>
  <input id="pin" type="password" inputmode="numeric" maxlength="10" placeholder="••••••" autocomplete="off">
  <button onclick="check()">Anmelden</button>
  <div class="msg" id="msg"></div>
</div>
<script>
var P={"574467": "a67407a0-03be-4cbc-a7d0-64828bb60ac2", "158856": "b79af856-d9f8-45b4-b19d-a2f020f47526", "870148": "fde09ed3-648d-4189-a7fb-3db31bdef5cc", "641644": "0db0bc47-0f47-418e-9a8f-0474ce8a0545"};
document.getElementById('pin').addEventListener('keydown',function(e){if(e.key==='Enter') check();});
function check(){var v=document.getElementById('pin').value.trim();var inp=document.getElementById('pin');var msg=document.getElementById('msg');if(P[v]){window.location.href='athlete/'+P[v]+'/';}else{inp.classList.remove('error');void inp.offsetWidth;inp.classList.add('error');msg.textContent='Falscher PIN. Bitte erneut versuchen.';inp.value='';}}
</script>
</body>
</html>
