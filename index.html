<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trainingsplan Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a2e;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:16px}
.card{background:#fff;border-radius:16px;padding:40px 32px;max-width:360px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.4);text-align:center}
h1{font-size:1.4rem;color:#1a1a2e;margin-bottom:6px}
p{color:#666;font-size:.9rem;margin-bottom:28px}
input{width:100%;padding:14px;font-size:1.5rem;letter-spacing:.3em;text-align:center;border:2px solid #ddd;border-radius:10px;outline:none;transition:border .2s}
input:focus{border-color:#3a86ff}
input.error{border-color:#e63946;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)} 75%{transform:translateX(6px)}}
button{margin-top:16px;width:100%;padding:14px;background:#3a86ff;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:background .2s}
button:hover{background:#2563eb}
.msg{margin-top:14px;font-size:.85rem;color:#e63946;min-height:18px}
</style>
</head>
<body>
<div class="card">
  <h1>Mein Trainingsplan</h1>
  <p>Bitte gib deinen persönlichen PIN ein.</p>
  <input id="pin" type="password" inputmode="numeric" maxlength="10" placeholder="••••••" autocomplete="off">
  <button onclick="check()">Anmelden</button>
  <div class="msg" id="msg"></div>
</div>
<script>
var P={"09ade3ae5da9c92e3c87750a770bc4aab2a0c8e3538cb28f8c81522260aaf000": "athlete/a67407a0-03be-4cbc-a7d0-64828bb60ac2/", "5a6ef2976d021fd62a9f8209d497d5b9d6faa903272ce794978aae180bd7dd91": "athlete/b79af856-d9f8-45b4-b19d-a2f020f47526/", "4a3ace864a4d6779ef7fda0c11683ed64bd81e269ea6af4c9c9414ed05231f72": "athlete/fde09ed3-648d-4189-a7fb-3db31bdef5cc/", "05b0246ccf7bea0df270635c71eee45fa93214cec39f26625a0db6d9ac2e08fd": "athlete/0db0bc47-0f47-418e-9a8f-0474ce8a0545/", "19a9d9fd339e3a8cfba04a2fbd0f9bd442f1b4a9cc12dfe67c5e7b95a40c054f": "trainer/"};
document.getElementById('pin').addEventListener('keydown',function(e){if(e.key==='Enter') check();});
async function sha256hex(s){var buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,"0");}).join("");}
async function check(){var v=document.getElementById('pin').value.trim();var inp=document.getElementById('pin');var msg=document.getElementById('msg');var h=await sha256hex(v);if(P[h]){window.location.href=P[h];}else{inp.classList.remove('error');void inp.offsetWidth;inp.classList.add('error');msg.textContent='Falscher PIN. Bitte erneut versuchen.';inp.value='';}}
</script>
</body>
</html>
